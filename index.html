function roomRows(kind){return (state.memories||[]).filter(r=>r.kind===kind)}
function roomTile(r){return `<article class="panel stack roomTile">${r.image?`<button style="padding:0;background:none;border:0" data-memory-view="${r.id}" aria-label="View image"><img src="${r.image}" alt="${esc(r.title)}"></button>`:`<div class="roomArt">${esc(r.symbol||'✧')}</div>`}<h3>${esc(r.title)}</h3><div class="memoryText">${esc(r.body)}</div>${r.date?`<small class="muted">${esc(pretty(r.date))}</small>`:''}<div class="row">${r.kind==='room'&&Object.hasOwn(roomTargets,r.target)?`<button class="primary small" data-room-go="${r.target}">Open ${esc(roomTargets[r.target])}</button>`:`<button class="small" data-memory-view="${r.id}">View</button>`}<button class="small" data-memory-edit="${r.id}">Edit</button><button class="small danger" data-memory-delete="${r.id}">Delete</button></div></article>`}
function roomPage(){app.innerHTML=heading('My Digital Room','My room. My rules. My little world.')+`<section class="panel stack"><h2>My little corners</h2><p class="muted">Decorate your room with photographs and shortcuts to your favourite pages.</p><div class="row"><button class="primary" id="roomAdd">+ Add a corner</button>${roomRows('room').length?'':'<button id="roomStarter">Create starter corners</button>'}</div></section><div class="roomGrid">${roomRows('room').map(roomTile).join('')}</div><section class="panel stack"><div class="row between"><h2>My treasure box</h2><button id="keepsakeAdd" class="primary">+ Keepsake</button></div><p class="muted">Postcards, tickets, letters and little things worth keeping.</p><div class="roomGrid">${roomRows('keepsake').map(roomTile).join('')||'<p class="muted">Your treasure box is empty.</p>'}</div></section>`;$('#roomAdd').onclick=()=>editMemory('room');$('#keepsakeAdd').onclick=()=>editMemory('keepsake');if($('#roomStarter'))$('#roomStarter').onclick=async()=>{for(const [title,target,symbol] of [['My desk','lists','✎'],['My bookshelf','media','▤'],['My memory wall','pins','♡'],['My diary','archive','✧']])state.memories.push(memoryRecord('room',{title,target,symbol}));if(await save())roomPage()};bindMemories()}
function memoryRecord(kind,values={}){return {id:uid(),kind,title:'',body:'',date:'',created:new Date().toISOString(),target:'',symbol:'✧',image:'',...values}}
function editMemory(kind,id){let r=state.memories.find(x=>x.id===id)||memoryRecord(kind),image=r.image,busy=false;modal.innerHTML=`<form class="stack" id="memoryForm"><h2>${id?'Edit':'New'} ${kind==='room'?'room corner':kind==='capsule'?'time capsule':'keepsake'}</h2><label>Title<input name="title" required maxlength="120" value="${esc(r.title)}"></label><label>${kind==='capsule'?'Letter to my future self':'Caption / notes'}<textarea name="body" rows="6">${esc(r.body)}</textarea></label>${kind==='room'?`<label>Link to page<select name="target"><option value="">No shortcut</option>${Object.entries(roomTargets).map(([k,v])=>`<option value="${k}" ${r.target===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Decorative symbol<input name="symbol" maxlength="12" value="${esc(r.symbol)}"></label>`:`<label>${kind==='capsule'?'Open on (required)':'Date (optional)'}<input name="date" type="date" ${kind==='capsule'?'required':''} value="${esc(r.date)}"></label>`}<label>Image (optional)<input id="memoryImage" type="file" accept="image/*"></label><div id="memoryPreview"></div><button type="button" id="memoryRemove">Remove image</button><div class="row"><button class="primary" id="memorySave">Save</button><button type="button" data-action="close">Cancel</button></div></form>`;let f=$('#memoryForm');function preview(){$('#memoryPreview').innerHTML=safeImage(image)?`<img class="memoryPhoto" src="${image}" alt="Preview">`:''}preview();$('#memoryRemove').onclick=()=>{if(!busy){image='';preview()}};$('#memoryImage').onchange=async e=>{let file=e.target.files[0];if(!file||busy)return;busy=true;$('#memorySave').disabled=true;try{let next=await compress(file);if(f.isConnected){image=next;preview()}}catch(err){alert(err.message)}finally{busy=false;if(f.isConnected)$('#memorySave').disabled=false}};f.onsubmit=async e=>{e.preventDefault();if(busy)return;let d=Object.fromEntries(new FormData(f));if(!d.title.trim())return;let v={...r,...d,image};state.memories=id?state.memories.map(x=>x.id===id?v:x):[...state.memories,v];if(await save()){modal.close();render()}};modal.showModal()}
function snapshotData(){return {counts:Object.fromEntries(stores.filter(k=>k!=='memories').map(k=>[k,committed[k].length])),profile:{title:worldCommitted.title,name:worldCommitted.name,bio:worldCommitted.bio,reading:worldCommitted.reading,watching:worldCommitted.watching,listening:worldCommitted.listening,loving:worldCommitted.loving,mood:worldCommitted.mood},appearance:{name:studio.name,theme:studio.theme,colors:[...studio.colors]},journals:committed.journals.filter(j=>j.status==='posted').map(j=>({title:j.title,date:j.date,body:j.body})),media:committed.media.map(m=>({title:m.title,type:m.type,rating:m.rating})),lists:committed.lists.map(l=>({title:l.title,items:l.items.map(i=>({text:i.text,done:i.done}))})),pins:committed.pins.map(p=>({title:p.title,description:p.description})),posts:committed.posts.map(p=>({title:p.title,body:p.body}))}}
function timePage(){let snapshots=roomRows('snapshot').sort((a,b)=>b.created.localeCompare(a.created)),capsules=roomRows('capsule'),now=dateKey(new Date());app.innerHTML=heading('Internet Time Machine','Visit an earlier version of yourself.')+`<section class="panel stack"><h2>Capture this moment</h2><p class="muted">Save a dated, read-only copy of your profile, appearance palette, journal text, list items, review titles and collection counts. Photographs stay in your main library; use a ZIP backup for a full historical copy.</p><button class="primary" id="captureMemory">Capture snapshot</button></section><section class="panel stack"><h2>My past eras</h2>${snapshots.map(r=>`<article class="entry stack"><div class="row between"><h3>${esc(r.title)}</h3><span class="muted">${esc(pretty(r.date))}</span></div><p>${esc(r.body)}</p><div class="row"><button class="primary small" data-memory-view="${r.id}">Revisit</button><button class="small danger" data-memory-delete="${r.id}">Delete snapshot</button></div></article>`).join('')||'<p class="muted">No snapshots yet.</p>'}</section><section class="panel stack"><div class="row between"><h2>Letters to my future self</h2><button class="primary" id="capsuleAdd">+ Time capsule</button></div><p class="muted">Letters are hidden until their chosen date. This is a sentimental feature, not encryption.</p>${capsules.map(r=>`<article class="entry stack"><h3>${esc(r.title)}</h3><p class="muted">${r.date>now?'Sealed until':'Ready to open ·'} ${esc(pretty(r.date))}</p><div class="row">${r.date<=now?`<button data-memory-view="${r.id}" class="primary small">Open letter</button><button data-memory-edit="${r.id}" class="small">Edit</button>`:''}<button data-memory-delete="${r.id}" class="small danger">Delete</button></div></article>`).join('')||'<p class="muted">No letters yet.</p>'}</section>`;$('#capsuleAdd').onclick=()=>editMemory('capsule');$('#captureMemory').onclick=()=>{modal.innerHTML=`<form id="captureForm" class="stack"><h2>Capture a moment in time</h2><label>Snapshot title<input name="title" required value="${esc('My '+new Date().getFullYear()+' era')}"></label><label>Note<textarea name="body"></textarea></label><div class="row"><button class="primary">Capture</button><button type="button" data-action="close">Cancel</button></div></form>`;$('#captureForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(!d.title.trim())return;state.memories.push(memoryRecord('snapshot',{...d,date:dateKey(new Date()),snapshot:snapshotData()}));if(await save()){modal.close();timePage()}};modal.showModal()};bindMemories()}
function bindMemories(){app.querySelectorAll('[data-room-go]').forEach(b=>b.onclick=()=>go(b.dataset.roomGo));app.querySelectorAll('[data-memory-edit]').forEach(b=>b.onclick=()=>{let r=state.memories.find(x=>x.id===b.dataset.memoryEdit);if(r&&r.kind!=='snapshot'&&(r.kind!=='capsule'||r.date<=dateKey(new Date())))editMemory(r.kind,r.id)});app.querySelectorAll('[data-memory-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this saved item? Other collections remain unchanged.'))return;state.memories=state.memories.filter(x=>x.id!==b.dataset.memoryDelete);if(await save())render()});app.querySelectorAll('[data-memory-view]').forEach(b=>b.onclick=()=>viewMemory(b.dataset.memoryView))}
function viewMemory(id){let r=state.memories.find(x=>x.id===id);if(!r||r.kind==='capsule'&&r.date>dateKey(new Date()))return;let d=r.snapshot||{},profile=d.profile||{},rows=(v)=>Array.isArray(v)?v:[];let detail=r.kind==='snapshot'?`<section class="entry stack"><h2>My world then</h2><h3>${esc(profile.title)}</h3><div class="memoryText">${esc(profile.bio)}</div>${['reading','watching','listening','loving','mood'].map(k=>`<p>${esc(k)}: ${esc(profile[k])}</p>`).join('')}<p>Theme: ${esc(d.appearance?.theme)}</p><div class="snapshotGrid">${Object.entries(d.counts||{}).map(([k,v])=>`<div class="snapshotStat"><strong>${esc(v)}</strong><br>${esc(k)}</div>`).join('')}</div></section><h2>Journal archive</h2>${rows(d.journals).map(j=>`<article class="entry"><h3>${esc(j.title||'Untitled')}</h3><small>${esc(j.date||'Undated')}</small><div class="memoryText">${esc(j.body)}</div></article>`).join('')}<h2>Lists</h2>${rows(d.lists).map(l=>`<article class="entry"><h3>${esc(l.title)}</h3>${rows(l.items).map(i=>`<p>${i.done?'✓':'•'} ${esc(i.text)}</p>`).join('')}</article>`).join('')}<h2>Media collection</h2>${rows(d.media).map(m=>`<p>${esc(m.title)} · ${esc(m.type)} · ${esc(m.rating)}/5</p>`).join('')}<h2>Pins & posts</h2>${[...rows(d.pins),...rows(d.posts)].map(p=>`<article class="entry"><h3>${esc(p.title||'Untitled')}</h3><div class="memoryText">${esc(p.description||p.body)}</div></article>`).join('')}`:'';modal.innerHTML=`<div class="stack"><div class="row between"><h2>${esc(r.title)}</h2><button data-action="close">Close</button></div>${r.date?`<p class="muted">${esc(pretty(r.date))}</p>`:''}${safeImage(r.image)?`<img class="memoryPhoto" src="${r.image}" alt="${esc(r.title)}">`:''}<div class="memoryText">${esc(r.body)}</div>${detail}</div>`;modal.showModal()}

applyFonts();applyStudio(studio);applyRetro(studio.retro);
app.innerHTML='<div class="panel">Opening your local database…</div>';document.querySelector('nav').inert=true;
initDB().then(loadWorld).then(loadEras).then(()=>{if(world.landing)page='world';document.querySelector('nav').inert=false;render()}).catch(e=>{app.textContent='Cannot open IndexedDB: '+e.message+'. Your old HTML and backups are unchanged. Try opening via a stable localhost or HTTPS address.'});
</script></body></html>
