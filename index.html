 .photos{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.photos:empty{display:none}.photos>div{display:grid;gap:4px}.photos button{padding:0;overflow:hidden}.photos div button{padding:4px 8px}.photos img{display:block;width:110px;height:90px;object-fit:cover;border-radius:8px}.photos.full img{width:160px;height:130px}.largePhoto{max-width:100%;max-height:75vh;object-fit:contain}#dateLabel[hidden]{display:none}  .listCover{display:block;width:100%;max-height:320px;object-fit:contain;background:var(--paper,#f4efe5);border-radius:10px;margin:8px 0 16px}.listItem{padding:7px 0;align-items:flex-start}.listItem span{overflow-wrap:anywhere;white-space:pre-wrap}.listMarker{min-width:24px;color:#78896d;font-weight:600}.listTitle{margin-bottom:4px}  .mediaHero{background:linear-gradient(120deg,#e7dfcf,#e9eddf);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:16px}.mediaHero h2{font:32px Georgia,serif;margin:8px 0}.mediaStats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin-bottom:16px}.mediaStats strong{font-size:24px}.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;margin-top:15px}.mediaCard{padding:0;text-align:left;overflow:hidden;background:var(--paper);border:1px solid var(--line);color:var(--ink)}.mediaCard>img,.mediaPlaceholder{width:100%;aspect-ratio:2/3;object-fit:contain;background:#e9e3d7;display:block}.mediaPlaceholder{display:grid;place-items:center;font-size:45px;color:var(--accent)}.mediaCardText{padding:12px;display:grid;gap:4px;overflow-wrap:anywhere}.mediaCardText small,.mediaCardText span{font-size:12px}.stars{color:#a47d30;letter-spacing:2px}.mediaFields,.reviewSections{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.reviewHead{display:flex;gap:18px;flex-wrap:wrap}.reviewCover{width:145px;max-width:100%;max-height:230px;object-fit:contain;border-radius:8px}.reviewPaper{background:#eee8dc;border-radius:14px;padding:16px 'use strict';const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');const key='little-lists-v3-prototype-1';const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=dateKey(new Date());const pretty=d=>!d?"Undated":new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={journals:[],events:[],lists:[],media:[]};
const stores=['journals','events','lists','media'];let db,revision=0,committed=structuredClone(state),saving=false;

const done=t=>new Promise((resolve,reject)=>{t.oncomplete=resolve;t.onabort=t.onerror=()=>reject(t.error||Error('Transaction aborted'))});
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('little-lists-v3-08a',1);r.onupgradeneeded=()=>{for(const k of stores)r.result.createObjectStore(k,{keyPath:'id'});r.result.createObjectStore('meta')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Close other Little Lists tabs'))})}
function blobify(x){if(typeof x==='string'&&safeImage(x)){let [head,data]=x.split(',');let raw=atob(data),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new Blob([bytes],{type:head.slice(5,-7)})}return x}
function unblob(x){if(!(x instanceof Blob))return Promise.resolve(x);return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(x)})}
function pack(k,r){let v={...r};if(k==='journals')v.images=(v.images||[]).map(blobify);if(k==='lists'||k==='media')v.cover=blobify(v.cover);if(k==='media')v.photos=(v.photos||[]).map(blobify);return v}
async function unpack(k,r){let v={...r};if(k==='journals')v.images=await Promise.all((v.images||[]).map(unblob));if(k==='lists'||k==='media')v.cover=await unblob(v.cover);if(k==='media')v.photos=await Promise.all((v.photos||[]).map(unblob));return v}
async function persist(){const packed=Object.fromEntries(stores.map(k=>[k,(state[k]||[]).map(r=>pack(k,r))]));let t=db.transaction([...stores,'meta'],'readwrite'), completion=done(t);let r=t.objectStore('meta').get('revision');r.onsuccess=()=>{if((r.result||0)!==revision){t.abort();return}try{for(let k of stores){let os=t.objectStore(k);os.clear();for(let v of packed[k])os.put(v)}t.objectStore('meta').put(revision+1,'revision')}catch(e){t.abort()}};await completion;revision++;committed=structuredClone(state)}
async function initDB(){db=await openDB();db.onversionchange=()=>{db.close();alert('Database updated in another tab. Reload this page.')};let t=db.transaction([...stores,'meta'],'readonly'), completion=done(t);let [rev,...rows]=await Promise.all([req(t.objectStore('meta').get('revision')),...stores.map(k=>req(t.objectStore(k).getAll()))]);await completion;revision=rev||0;if(revision){for(let i=0;i<stores.length;i++)state[stores[i]]=await Promise.all(rows[i].map(r=>unpack(stores[i],r)));committed=structuredClone(state)}else{let raw=localStorage.getItem(key);if(raw){let old=JSON.parse(raw);if(!valid(old))throw Error('Old data could not be validated; export it from 0.7 first.');state={...old,media:old.media||[]}}await persist()}}
let page='home',selected=today,month=new Date(),editing=null,search='',filter='all';month.setDate(1);function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,2800)}async function save(){if(saving)return false;saving=true;document.querySelector('.shell').inert=true;modal.inert=true;try{await persist();return true}catch(e){state=structuredClone(committed);alert('Save failed. Your previous saved data is safe. Storage may be full or another tab changed the database. Export a backup or reload before retrying.');return false}finally{saving=false;document.querySelector('.shell').inert=false;modal.inert=false}}function go(p){if(page==='write'&&p!=='write'&&$('#journalForm')&&$('#journalForm').dataset.dirty==='yes'&&!confirm('Leave unsaved journal changes?'))return;page=p;if(p==='write')editing=null;render();window.scrollTo(0,0)}function heading(t,s,action=''){return `<div class="top"><div><h1>${t}</h1><div class="muted">${s}</div></div>${action}</div>`}function btn(t,action,cls=''){return `<button class="${cls}" data-action="${action}">${t}</button>`}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,write,archive,calendar,lists,media,settings,fonts:fontsPage}[page]||home)()}function eventCard(e){return `<div class="event" data-cat="${esc(e.category)}"><div class="row between"><strong>${esc(e.title)}</strong>${btn('Edit','edit-event:'+e.id,'small')}</div><div class="muted">${e.allDay?'All day':esc(e.start)+(e.end?' – '+esc(e.end):'')} · ${esc(e.category)}</div>${e.notes?`<div class="pre">${esc(e.notes)}</div>`:''}</div>`}let journalImages=[],imageBusy=false;const safeImage=x=>typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x);function gallery(j,full=false){return `<div class="photos ${full?'full':''}">${(j.images||[]).filter(safeImage).map((src,i)=>`<button type="button" data-ac
